# Builds and tests Pendulum through buildkit's reusable CI workflow: the "ci"
# preset (library and console app) and the "qt" preset (with the Qt viewer),
# each with GCC and Clang, plus the coverage and asan presets, lint and
# static analysis.
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: medaminben/buildkit/.github/workflows/ci.yml@v2.0.1
    permissions:
      contents: read
    with:
      presets: "ci qt"
      compilers: "gcc clang"
      apt-packages: "qt6-base-dev"
      sanitizers: true
      static-analysis: true
      coverage: true
