# Tags and releases every pull request merged into main, by its semver:* label
# (semver:patch without a label, semver:none for no release).
name: Release

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  release:
    uses: medaminben/buildkit/.github/workflows/release.yml@v2.0.1
    permissions:
      contents: write
      actions: write
